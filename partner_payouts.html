<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>FixWheel — Settlements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css?v=2027">
  <link rel="stylesheet" href="sidebar.css?v=2027">
  <script src="auth_guard.js?v=2026"></script>
  <script src="sidebar.js?v=2033"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text-1); font-family: var(--sans); }
    button, input, select, textarea { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
    .topbar { position: sticky; top: 0; z-index: 100; height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 36px; border-bottom: 1px solid var(--border); background: var(--topbar-bg); }
    .topbar-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .topbar-title strong { font-size: 15px; text-transform: uppercase; }
    .topbar-title span { color: var(--text-3); font: 11px var(--mono); }
    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .live { display: flex; align-items: center; gap: 7px; color: var(--text-2); font: 10.5px var(--mono); }
    .live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 2px 8px rgba(34, 197, 94, .45); }
    .theme-button, .account { border: 1px solid var(--border-hi); border-radius: 8px; background: var(--surface-2); color: var(--text-2); padding: 7px 11px; font: 11px var(--mono); }
    .theme-button { cursor: pointer; }
    .page { width: min(1540px, calc(100% - 48px)); margin: 0 auto; padding: 24px 0 40px; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
    .metric { min-width: 0; padding: 18px 20px; }
    .metric + .metric { border-left: 1px solid var(--border); }
    .metric-label { color: var(--text-3); font: 10px var(--mono); letter-spacing: .05em; text-transform: uppercase; }
    .metric-value { margin-top: 7px; color: var(--text-1); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .metric-value.warn { color: #fbbf24; }
    .metric-value.good { color: #4ade80; }
    .metric-value.loss { color: #f87171; }
    .filters { margin-top: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 13px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .control { min-height: 38px; border: 1px solid var(--border-hi); border-radius: 7px; background: var(--surface-2); color: var(--text-1); padding: 8px 10px; font-size: 12px; outline: none; }
    .control.search { flex: 1 1 260px; }
    .control.date { width: 145px; color-scheme: dark; font-family: var(--mono); }
    .result-count { margin-left: auto; color: var(--text-3); font: 10.5px var(--mono); white-space: nowrap; }
    .table-shell { margin-top: 18px; border: 1px solid var(--border); border-radius: 12px; overflow: auto; background: var(--surface); }
    table { width: 100%; min-width: 1260px; border-collapse: collapse; }
    th { position: sticky; top: 0; z-index: 2; padding: 11px 14px; background: var(--surface-2); color: var(--text-3); border-bottom: 1px solid var(--border); text-align: left; font: 9.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
    td { padding: 13px 14px; border-bottom: 1px solid var(--border); font-size: 12px; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    .order-row:hover { background: rgba(255, 255, 255, .018); }
    .primary { display: block; color: var(--text-1); font-weight: 700; line-height: 1.35; }
    .secondary { display: block; margin-top: 3px; color: var(--text-3); font: 10.5px var(--mono); line-height: 1.4; }
    .money { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .loss-value { color: #f87171; }
    .status { display: inline-flex; align-items: center; gap: 6px; min-height: 25px; padding: 4px 8px; border: 1px solid var(--border-hi); border-radius: 6px; color: var(--text-2); font: 10px var(--mono); white-space: nowrap; }
    .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.settled { color: #4ade80; border-color: var(--green-dim); background: var(--green-glow); }
    .status.partial { color: #fbbf24; border-color: var(--yellow-dim); background: var(--yellow-glow); }
    .status.review { color: #f87171; border-color: var(--red-dim); background: var(--red-glow); }
    .review-button { min-height: 32px; padding: 6px 10px; border: 1px solid var(--border-hi); border-radius: 7px; background: var(--surface-2); color: var(--text-1); cursor: pointer; font-size: 11px; }
    .review-button:hover { border-color: var(--red); background: var(--red-glow); }
    .review-row { display: none; background: rgba(0, 0, 0, .18); }
    .review-row.open { display: table-row; }
    .review-cell { padding: 0; }
    .review-panel { padding: 18px 20px 22px; border-top: 1px solid var(--border-hi); }
    .review-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; color: var(--text-2); font: 10.5px var(--mono); }
    .review-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 22px; }
    .review-section { min-width: 0; }
    .review-section + .review-section { border-left: 1px solid var(--border); padding-left: 22px; }
    .review-section h3 { margin: 0 0 13px; font-size: 13px; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .field.full { grid-column: 1 / -1; }
    .field label { display: block; margin-bottom: 5px; color: var(--text-3); font: 9.5px var(--mono); text-transform: uppercase; letter-spacing: .04em; }
    .field input, .field textarea { width: 100%; min-height: 38px; border: 1px solid var(--border-hi); border-radius: 7px; background: var(--surface); color: var(--text-1); padding: 8px 9px; outline: none; }
    .field textarea { min-height: 68px; resize: vertical; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .primary-button { min-height: 34px; border: 1px solid var(--red); border-radius: 7px; background: var(--red); color: #fff; padding: 7px 12px; cursor: pointer; font-weight: 700; font-size: 11px; }
    .primary-button:disabled { opacity: .55; cursor: wait; }
    .side-checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .side-check { display: flex; align-items: center; gap: 9px; min-height: 42px; padding: 9px 10px; border: 1px solid var(--border-hi); border-radius: 7px; background: var(--surface); color: var(--text-2); cursor: pointer; }
    .side-check input { width: 16px; height: 16px; accent-color: #22c55e; }
    .side-check.locked { color: var(--text-3); cursor: not-allowed; opacity: .68; }
    .settlement-lock { display: block; margin-top: 7px; color: #fbbf24; font: 10px var(--mono); }
    .payment-list { display: flex; flex-wrap: wrap; gap: 7px; min-height: 28px; }
    .payment-id { max-width: 100%; border: 1px solid var(--border-hi); border-radius: 6px; background: var(--surface); color: #93c5fd; padding: 5px 8px; cursor: copy; font: 9.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .payment-add { display: flex; gap: 8px; margin-top: 10px; }
    .payment-add input { flex: 1; min-width: 0; }
    .inline-error { min-height: 16px; margin-top: 6px; color: #f87171; font: 10px var(--mono); }
    .empty { padding: 48px 20px; text-align: center; color: var(--text-3); font: 11px var(--mono); }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 1500; min-width: 240px; max-width: 420px; padding: 11px 13px; border: 1px solid var(--border-hi); border-radius: 8px; background: var(--surface-2); color: var(--text-1); box-shadow: 0 12px 28px rgba(0,0,0,.28); font-size: 11px; transform: translateY(18px); opacity: 0; pointer-events: none; transition: .18s ease; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { border-color: var(--red-dim); color: #fca5a5; }
    ::selection { background: rgba(239, 68, 68, .32); color: #fff; }
    * { scrollbar-color: var(--border-hi) transparent; scrollbar-width: thin; }
    @media (max-width: 980px) {
      .page { width: min(100% - 28px, 1540px); }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric:nth-child(3) { border-left: 0; border-top: 1px solid var(--border); }
      .metric:nth-child(4) { border-top: 1px solid var(--border); }
      .review-grid { grid-template-columns: 1fr; }
      .review-section + .review-section { border-left: 0; border-top: 1px solid var(--border); padding: 18px 0 0; }
      .topbar-title span, .account { display: none; }
    }
    @media (max-width: 620px) {
      .topbar { padding: 0 16px; }
      .page { width: calc(100% - 24px); padding-top: 14px; }
      .summary { grid-template-columns: 1fr; }
      .metric + .metric { border-left: 0; border-top: 1px solid var(--border); }
      .field-grid, .side-checks { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .result-count { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-title"><strong>Settlements</strong><span>/ Completed orders</span></div>
      <div class="topbar-actions">
        <button id="theme-toggle" class="theme-button" type="button">Theme</button>
        <span class="live">LIVE</span>
        <span class="account" id="admin-email">admin@fixwheel.app</span>
      </div>
    </header>
    <main class="page">
      <section class="summary" aria-label="Settlement summary">
        <div class="metric"><div class="metric-label">Completed orders</div><div class="metric-value" id="metric-completed">0</div></div>
        <div class="metric"><div class="metric-label">Needs review</div><div class="metric-value warn" id="metric-review">0</div></div>
        <div class="metric"><div class="metric-label">Fully settled</div><div class="metric-value good" id="metric-settled">0</div></div>
        <div class="metric"><div class="metric-label">Recorded loss</div><div class="metric-value loss" id="metric-loss">₹0</div></div>
      </section>
      <section class="filters" aria-label="Settlement filters">
        <input id="search" class="control search" type="search" placeholder="Search order, customer, partner, or payment reference" oninput="renderSettlements()">
        <select id="status-filter" class="control" onchange="renderSettlements()"><option value="all">All settlement states</option><option value="review" selected>Needs review</option><option value="partial">One side settled</option><option value="settled">Fully settled</option><option value="loss">Orders with loss</option></select>
        <input id="date-from" class="control date" type="date" aria-label="Completed from" onchange="renderSettlements()">
        <input id="date-to" class="control date" type="date" aria-label="Completed to" onchange="renderSettlements()">
        <span class="result-count" id="result-count">0 orders</span>
      </section>
      <section class="table-shell" aria-label="Completed order settlements">
        <table><thead><tr><th>Order</th><th>Customer / Partner</th><th>Completed</th><th>Final amount</th><th>Loss</th><th>FixWheel</th><th>Partner</th><th>Payment IDs</th><th>Review</th></tr></thead><tbody id="settlement-body"><tr><td colspan="9" class="empty">Loading settlements…</td></tr></tbody></table>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let settlementOrders = [];
    let expandedOrderKey = null;
    let toastTimer = null;
    const escapeText = value => String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    const money = value => `₹${Number(value || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 })}`;
    const orderKey = order => String(order.bookingRef || order.id);
    const orderColumn = order => order.bookingRef ? 'bookingRef' : 'id';
    const isPaymentReference = value => /^[a-z0-9][a-z0-9._:/-]{5,127}$/i.test(String(value || '').trim());
    const hasPaymentReference = order => Array.isArray(order?.payments) && order.payments.some(value => isPaymentReference(value));
    const isComplete = order => { const status = String(order.order_status || order.status || '').toLowerCase(); return (status.includes('completed') || status.includes('payment received')) && !status.includes('test order') && !status.includes('sandbox'); };
    const finishedIso = order => order.finished_at || order.order_finished_date || order.bookingDate || order.createdAt;
    const formatDate = value => { if (!value) return '—'; const raw = String(value); const date = new Date(raw.endsWith('Z') || raw.includes('+') ? raw : raw + 'Z'); return isNaN(date.getTime()) ? raw : date.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' }); };
    function notify(message, isError = false) { const toast = document.getElementById('toast'); toast.textContent = message; toast.className = `toast show${isError ? ' error' : ''}`; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.className = 'toast'; }, 2600); }
    function settlementState(order) { if (!hasPaymentReference(order)) return 'review'; if (order.fixwheel_payment_settled && order.partner_payment_settled) return 'settled'; if (order.fixwheel_payment_settled || order.partner_payment_settled) return 'partial'; return 'review'; }
    function stateLabel(state) { if (state === 'settled') return 'Fully settled'; if (state === 'partial') return 'One side settled'; return 'Needs review'; }
    async function fetchSettlements() {
      const { data, error } = await supabaseClient.from('Booking').select('*').order('createdAt', { ascending: false });
      if (error) { document.getElementById('settlement-body').innerHTML = `<tr><td colspan="9" class="empty">Could not load settlements: ${escapeText(error.message)}</td></tr>`; return; }
      settlementOrders = (data || []).filter(isComplete);
      renderSettlements();
    }
    function renderSettlements() {
      const search = String(document.getElementById('search')?.value || '').trim().toLowerCase();
      const filter = document.getElementById('status-filter')?.value || 'all';
      const from = document.getElementById('date-from')?.value || '';
      const to = document.getElementById('date-to')?.value || '';
      const completed = settlementOrders.length;
      const settled = settlementOrders.filter(order => settlementState(order) === 'settled').length;
      const review = completed - settled;
      const totalLoss = settlementOrders.reduce((sum, order) => sum + Number(order.loss_amount || 0), 0);
      document.getElementById('metric-completed').textContent = completed.toLocaleString('en-IN');
      document.getElementById('metric-review').textContent = review.toLocaleString('en-IN');
      document.getElementById('metric-settled').textContent = settled.toLocaleString('en-IN');
      document.getElementById('metric-loss').textContent = money(totalLoss);
      const visible = settlementOrders.filter(order => {
        const state = settlementState(order);
        const paymentText = Array.isArray(order.payments) ? order.payments.join(' ') : '';
        const haystack = [order.bookingRef, order.id, order.customerName, order['Assign Mechanic'], paymentText].join(' ').toLowerCase();
        if (search && !haystack.includes(search)) return false;
        if (filter === 'loss' && Number(order.loss_amount || 0) <= 0) return false;
        if (!['all', 'loss'].includes(filter) && state !== filter) return false;
        const dateKey = String(finishedIso(order) || '').slice(0, 10);
        if (from && dateKey < from) return false;
        if (to && dateKey > to) return false;
        return true;
      });
      document.getElementById('result-count').textContent = `${visible.length.toLocaleString('en-IN')} order${visible.length === 1 ? '' : 's'}`;
      const body = document.getElementById('settlement-body');
      if (!visible.length) { body.innerHTML = '<tr><td colspan="9" class="empty">No completed orders match these filters.</td></tr>'; return; }
      body.innerHTML = visible.map(order => {
        const key = orderKey(order), column = orderColumn(order), encodedKey = encodeURIComponent(key), state = settlementState(order);
        const payments = Array.isArray(order.payments) ? order.payments.filter(isPaymentReference) : [];
        const canSettle = payments.length > 0;
        const loss = Number(order.loss_amount || 0), open = expandedOrderKey === key, fullStatus = order.order_status || order.status || 'Completed';
        return `<tr class="order-row">
          <td><span class="primary" style="color:#60a5fa;font-family:var(--mono);">#${escapeText(order.bookingRef || String(order.id).slice(0, 8))}</span><span class="secondary">${escapeText(fullStatus)}</span></td>
          <td><span class="primary">${escapeText(order.customerName || 'Unknown customer')}</span><span class="secondary">${escapeText(order['Assign Mechanic'] || 'Unassigned')}</span></td>
          <td><span class="primary">${formatDate(finishedIso(order))}</span><span class="secondary">${escapeText(order.city || 'City not recorded')}</span></td>
          <td><span class="money primary">${money(Number(order.Final_Amount) || Number(order.price) || 0)}</span><span class="secondary">Quoted ${money(order.price || 0)}</span></td>
          <td><span class="money primary ${loss > 0 ? 'loss-value' : ''}">${money(loss)}</span><span class="secondary">${escapeText(order.loss_reason || (loss > 0 ? 'Reason required' : 'No loss recorded'))}</span></td>
          <td><span class="status ${canSettle && order.fixwheel_payment_settled ? 'settled' : 'review'}">${canSettle && order.fixwheel_payment_settled ? 'Settled' : 'Pending'}</span></td>
          <td><span class="status ${canSettle && order.partner_payment_settled ? 'settled' : 'review'}">${canSettle && order.partner_payment_settled ? 'Settled' : 'Pending'}</span></td>
          <td><span class="primary">${payments.length}</span><span class="secondary">${payments.length ? 'Recorded' : 'None recorded'}</span></td>
          <td><button type="button" class="review-button" onclick="toggleReview('${escapeText(encodedKey)}')">${open ? 'Close' : 'Review'}</button></td></tr>
          <tr class="review-row ${open ? 'open' : ''}"><td colspan="9" class="review-cell"><div class="review-panel">
            <div class="review-meta"><span class="status ${state}">${stateLabel(state)}</span><span>Full status: ${escapeText(fullStatus)}</span><span>Settled: ${escapeText(formatDate(order.settled_at))}</span></div>
            <div class="review-grid"><section class="review-section"><h3>Loss and settlement</h3>
              <form data-id="${escapeText(encodedKey)}" data-column="${column}" onsubmit="saveLoss(event, this)"><div class="field-grid">
                <div class="field"><label>Loss amount</label><input name="loss_amount" type="number" min="0" step="0.01" value="${escapeText(loss)}"></div>
                <div class="field"><label>Order amount</label><input value="${escapeText(money(Number(order.Final_Amount) || Number(order.price) || 0))}" disabled></div>
                <div class="field full"><label>Loss reason</label><textarea name="loss_reason" placeholder="Required when a loss is recorded">${escapeText(order.loss_reason || '')}</textarea></div>
              </div><div class="inline-error" role="alert"></div><div class="actions"><button type="submit" class="primary-button">Save loss review</button></div></form>
              <div class="side-checks" style="margin-top:14px;"><label class="side-check ${canSettle ? '' : 'locked'}" title="${canSettle ? '' : 'Add a payment reference first'}"><input type="checkbox" ${canSettle && order.fixwheel_payment_settled ? 'checked' : ''} ${canSettle ? '' : 'disabled'} onchange="updateSettlementSide('${escapeText(encodedKey)}','${column}','fixwheel',this.checked,this)">FixWheel payment settled</label><label class="side-check ${canSettle ? '' : 'locked'}" title="${canSettle ? '' : 'Add a payment reference first'}"><input type="checkbox" ${canSettle && order.partner_payment_settled ? 'checked' : ''} ${canSettle ? '' : 'disabled'} onchange="updateSettlementSide('${escapeText(encodedKey)}','${column}','partner',this.checked,this)">Partner payment settled</label></div>
              ${canSettle ? '' : '<span class="settlement-lock">Add a payment reference first.</span>'}
            </section><section class="review-section"><h3>Payment references</h3>
              <div class="payment-list">${payments.length ? payments.map(id => `<button type="button" class="payment-id" title="Copy payment reference" onclick="copyPaymentId('${escapeText(id)}')">${escapeText(id)}</button>`).join('') : '<span class="secondary">No payment reference recorded.</span>'}</div>
              <form class="payment-add" data-id="${escapeText(encodedKey)}" data-column="${column}" onsubmit="addPaymentReference(event, this)"><div class="field" style="flex:1;"><label>Payment UUID or transaction ID</label><input name="payment_reference" placeholder="e.g. 006502549067 or provider UUID" autocomplete="off" minlength="6" maxlength="128"></div><button type="submit" class="primary-button" style="align-self:flex-end;">Add payment ID</button></form><div class="inline-error payment-error" role="alert"></div>
            </section></div></div></td></tr>`;
      }).join('');
    }
    function toggleReview(encodedKey) { const key = decodeURIComponent(encodedKey); expandedOrderKey = expandedOrderKey === key ? null : key; renderSettlements(); }
    function findSettlementOrder(id, column) { return settlementOrders.find(order => String(order[column]) === String(id) || String(order.bookingRef) === String(id) || String(order.id) === String(id)); }
    async function updateBooking(id, column, payload) { const { error } = await supabaseClient.from('Booking').update(payload).eq(column, id).select(); if (error) throw error; const order = findSettlementOrder(id, column); if (order) Object.assign(order, payload); renderSettlements(); }
    async function saveLoss(event, form) {
      event.preventDefault(); const id = decodeURIComponent(form.dataset.id || ''), column = form.dataset.column || 'id';
      const amount = Number(form.elements.loss_amount.value || 0), reason = String(form.elements.loss_reason.value || '').trim(), errorEl = form.querySelector('.inline-error');
      if (!Number.isFinite(amount) || amount < 0) { errorEl.textContent = 'Enter a valid loss amount.'; return; }
      if (amount > 0 && !reason) { errorEl.textContent = 'Add a reason for the recorded loss.'; return; }
      errorEl.textContent = ''; const button = form.querySelector('button[type="submit"]'); button.disabled = true; button.textContent = 'Saving…';
      try { await updateBooking(id, column, { loss_amount: amount, loss_reason: amount > 0 ? reason : null, updated_by: 'Admin' }); notify('Loss review saved.'); }
      catch (error) { errorEl.textContent = `Could not save: ${error.message}`; button.disabled = false; button.textContent = 'Save loss review'; }
    }
    async function updateSettlementSide(encodedId, column, side, checked, checkbox) {
      const id = decodeURIComponent(encodedId), order = findSettlementOrder(id, column); if (!order) return;
      if (checked && !hasPaymentReference(order)) { checkbox.checked = false; notify('Add a payment reference before marking a payment settled.', true); renderSettlements(); return; }
      checkbox.disabled = true;
      const fixwheelSettled = side === 'fixwheel' ? checked : !!order.fixwheel_payment_settled;
      const partnerSettled = side === 'partner' ? checked : !!order.partner_payment_settled;
      const fullySettled = fixwheelSettled && partnerSettled;
      const payload = { fixwheel_payment_settled: fixwheelSettled, partner_payment_settled: partnerSettled, settlement: fullySettled ? 'Done' : 'Pending', payment_settled: fullySettled ? 'Done' : 'Pending', settled_at: fullySettled ? new Date().toISOString() : null, updated_by: 'Admin' };
      try { await updateBooking(id, column, payload); notify(fullySettled ? 'Order marked fully settled.' : 'Settlement side updated.'); }
      catch (error) { checkbox.checked = !checked; checkbox.disabled = false; notify(`Could not update settlement: ${error.message}`, true); }
    }
    async function addPaymentReference(event, form) {
      event.preventDefault(); const id = decodeURIComponent(form.dataset.id || ''), column = form.dataset.column || 'id';
      const value = String(form.elements.payment_reference.value || '').trim(), errorEl = form.parentElement.querySelector('.payment-error');
      if (!isPaymentReference(value)) { errorEl.textContent = 'Enter a valid payment UUID or transaction ID (at least 6 characters).'; return; }
      const order = findSettlementOrder(id, column), payments = Array.isArray(order?.payments) ? [...order.payments] : [];
      if (payments.some(payment => String(payment).toLowerCase() === value.toLowerCase())) { errorEl.textContent = 'This payment reference is already recorded.'; return; }
      errorEl.textContent = ''; const button = form.querySelector('button[type="submit"]'); button.disabled = true; button.textContent = 'Adding…';
      try { await updateBooking(id, column, { payments: [...payments, value], updated_by: 'Admin' }); notify('Payment reference added.'); }
      catch (error) { errorEl.textContent = `Could not add payment ID: ${error.message}`; button.disabled = false; button.textContent = 'Add payment ID'; }
    }
    async function copyPaymentId(value) { try { await navigator.clipboard.writeText(value); notify('Payment reference copied.'); } catch { notify('Could not copy the payment reference.', true); } }
    document.getElementById('theme-toggle').addEventListener('click', () => { const isLight = document.documentElement.getAttribute('data-theme') === 'light'; if (isLight) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', 'light'); localStorage.setItem('theme', isLight ? 'dark' : 'light'); });
    document.addEventListener('DOMContentLoaded', () => { renderSidebar('settlements'); const user = JSON.parse(localStorage.getItem('fixwheel_staff_user') || '{}'); if (user.email) document.getElementById('admin-email').textContent = user.email; fetchSettlements(); });
  </script>
</body>
